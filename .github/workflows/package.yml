name: Package

on:
  push:
    tags: ['**']

permissions:
  contents: read

jobs:
  windows:
    name: Windows amd64
    if: github.event.created && !github.event.deleted
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            curl make patch
            mingw-w64-ucrt-x86_64-gcc
      - name: Build Windows package
        shell: msys2 {0}
        run: |
          set -eu
          sh scripts/build-ffmpeg.sh
          sh scripts/package.sh
      - uses: actions/upload-artifact@v7
        with:
          path: dist/SilenceCut-windows-x64.zip
          archive: false
          if-no-files-found: error
          overwrite: true

  macos:
    name: macOS arm64
    if: github.event.created && !github.event.deleted
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build macOS package
        run: |
          sh scripts/build-ffmpeg.sh
          sh scripts/package.sh
      - uses: actions/upload-artifact@v7
        with:
          path: dist/SilenceCut-macos-arm64.zip
          archive: false
          if-no-files-found: error
          overwrite: true

  release:
    name: Publish GitHub Release
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: SilenceCut-*.zip
          merge-multiple: true
          path: dist
      - name: Publish both packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          packages=(dist/SilenceCut-windows-x64.zip dist/SilenceCut-macos-arm64.zip)
          for package in "${packages[@]}"; do
            test -s "$package"
          done
          if gh release view --json assets,isDraft -- "$TAG" > "$RUNNER_TEMP/release.json"; then
            jq -r '.assets[].name' "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/release-assets"
            missing=()
            for package in "${packages[@]}"; do
              if ! grep -Fxq "${package##*/}" "$RUNNER_TEMP/release-assets"; then
                missing+=("$package")
              fi
            done
            if (( ${#missing[@]} )); then
              gh release upload -- "$TAG" "${missing[@]}"
            fi
            if jq -e '.isDraft' "$RUNNER_TEMP/release.json" > /dev/null; then
              gh release edit --draft=false -- "$TAG"
            fi
          else
            gh release create --verify-tag --generate-notes -- "$TAG" "${packages[@]}"
          fi
