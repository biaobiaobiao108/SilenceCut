name: Package

on:
  workflow_dispatch:
  push:
    branches: ['verify/**']
    tags: ['**']

permissions:
  contents: read

env:
  SILENCECUT_VERSION: ${{ github.ref_name }}

jobs:
  windows:
    name: Windows amd64
    if: github.event_name == 'workflow_dispatch' || !github.event.deleted
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            curl make patch
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-nasm
      - name: Build Windows package
        shell: msys2 {0}
        run: |
          set -eu
          sh scripts/build-ffmpeg.sh
          sh scripts/package.sh
      - uses: actions/upload-artifact@v7
        with:
          path: dist/SilenceCut-windows-x64-setup.exe
          archive: false
          if-no-files-found: error
          overwrite: true

  macos:
    name: macOS arm64
    if: github.event_name == 'workflow_dispatch' || !github.event.deleted
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build macOS package
        run: |
          sh scripts/build-ffmpeg.sh
          sh scripts/package.sh
      - uses: actions/upload-artifact@v7
        with:
          path: dist/SilenceCut-macos-arm64.pkg
          archive: false
          if-no-files-found: error
          overwrite: true

  verify-windows:
    name: Verify Windows installer
    needs: windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: SilenceCut-windows-x64-setup.exe
      - name: Install, launch and uninstall
        run: ./scripts/check-windows-install.ps1 -Installer ./SilenceCut-windows-x64-setup.exe

  verify-macos:
    name: Verify macOS installer
    needs: macos
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: SilenceCut-macos-arm64.pkg
      - name: Install and launch
        run: |
          set -eu
          sudo installer -pkg SilenceCut-macos-arm64.pkg -target /
          app=/Applications/SilenceCut.app
          for notice in SilenceCut.txt Go/LICENSE FFmpeg/LICENSE.md; do
            test -s "$app/Contents/Resources/Notices/$notice"
          done
          codesign --verify --strict --deep "$app"
          env -i HOME="$HOME" TMPDIR="${TMPDIR:-/tmp}" PATH=/usr/bin:/bin "$app/Contents/MacOS/SilenceCut" &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          sleep 5
          kill -0 "$pid"

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.event.created
    needs: [verify-windows, verify-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: SilenceCut-*
          merge-multiple: true
          path: dist
      - name: Publish both packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          packages=(dist/SilenceCut-windows-x64-setup.exe dist/SilenceCut-macos-arm64.pkg)
          for package in "${packages[@]}"; do
            test -s "$package"
          done
          if gh release view --json assets,isDraft -- "$TAG" > "$RUNNER_TEMP/release.json"; then
            jq -r '.assets[].name' "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/release-assets"
            missing=()
            for package in "${packages[@]}"; do
              if ! grep -Fxq "${package##*/}" "$RUNNER_TEMP/release-assets"; then
                missing+=("$package")
              fi
            done
            if (( ${#missing[@]} )); then
              gh release upload -- "$TAG" "${missing[@]}"
            fi
            if jq -e '.isDraft' "$RUNNER_TEMP/release.json" > /dev/null; then
              gh release edit --draft=false -- "$TAG"
            fi
          else
            gh release create --verify-tag --generate-notes -- "$TAG" "${packages[@]}"
          fi
